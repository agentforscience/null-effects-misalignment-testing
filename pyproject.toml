    "peft>=0.20.0",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "torch>=2.7,<2.10",
    "transformers>=4.55,<5",
    "trl>=1.9.2",
